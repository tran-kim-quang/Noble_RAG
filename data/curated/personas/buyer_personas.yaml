personas:
  - id: mua_o_gia_dinh
    label: "Mua để ở - Gia đình"
    description: "Gia đình 2-4 người muốn an cư lâu dài"
    budget_range: "2-7 tỷ"
    property_types: [can_ho, nha_pho]
    key_priorities:
      - Vị trí gần trường học, bệnh viện
      - An ninh tốt
      - Môi trường sống lành mạnh
      - Pháp lý rõ ràng
    discovery_questions:
      - "Anh/Chị đang tìm cho gia đình mấy người ạ?"
      - "Anh/Chị ưu tiên gần trường học hay nơi làm việc hơn?"

  - id: dau_tu_cho_thue
    label: "Đầu tư cho thuê"
    description: "Mua để cho thuê, tạo dòng tiền thụ động"
    budget_range: "2-10 tỷ"
    property_types: [can_ho, shophouse]
    key_priorities:
      - Tỷ suất cho thuê cao (4-7%/năm)
      - Vị trí gần khu văn phòng, KCN
      - Thanh khoản tốt khi cần bán lại
    discovery_questions:
      - "Anh/Chị dự định cho thuê ngắn hạn hay dài hạn ạ?"
      - "Mức giá cho thuê kỳ vọng mỗi tháng là bao nhiêu ạ?"

  - id: dau_tu_tang_gia
    label: "Đầu tư tăng giá"
    description: "Mua để hưởng lợi khi bất động sản tăng giá"
    budget_range: "3-20 tỷ"
    property_types: [can_ho, biet_thu, dat_nen, shophouse]
    key_priorities:
      - Khu vực đang phát triển hạ tầng
      - Chủ đầu tư uy tín
      - Thanh khoản tốt
    discovery_questions:
      - "Anh/Chị dự kiến giữ trong bao lâu ạ (1-2 năm hay dài hạn hơn)?"
      - "Anh/Chị đang xem xét khu vực nào, hay còn linh hoạt?"
