cta: book_site_visit
label: "Hẹn đi xem dự án"
triggers:
  - "muốn đi xem"
  - "tham quan dự án"
  - "xem thực tế"
  - "đến xem nhà mẫu"

script: |
  Dạ, em rất vui được sắp xếp lịch tham quan cho Anh/Chị!
  
  Nhà mẫu mở cửa [thứ 2 - Chủ nhật, 8h - 17h].
  
  Anh/Chị tiện vào buổi sáng hay chiều? Và ngày nào trong tuần này hoặc tuần sau phù hợp ạ?
  
  Khi đi xem, em sẽ chuẩn bị sẵn:
  - Hồ sơ pháp lý
  - Bảng giá chi tiết
  - Chính sách thanh toán
  - Thông tin vay ngân hàng
  
  Để em đặt lịch cho Anh/Chị, anh/chị có thể cho em xin số điện thoại để xác nhận không ạ?

follow_up: "Em sẽ gửi reminder nhắc lịch trước 1 ngày qua Zalo/SMS."
