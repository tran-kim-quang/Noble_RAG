objection: suy_nghi_them
label: "Muốn suy nghĩ thêm"
triggers:
  - "để suy nghĩ thêm"
  - "chưa quyết định được"
  - "cần thêm thời gian"
  - "hỏi ý kiến gia đình"
  - "tham khảo thêm"

approach:
  - step: respect
    script: "Dạ, quyết định mua bất động sản cần cân nhắc kỹ. Em hoàn toàn hiểu và tôn trọng điều đó."
  - step: identify_blocker
    script: "Anh/Chị có thể chia sẻ điều gì khiến Anh/Chị còn băn khoăn không? Để em hỗ trợ thêm thông tin cho đúng chỗ ạ."
  - step: micro_commitment
    script: "Em xin phép gửi Anh/Chị một shortlist 2-3 sản phẩm phù hợp nhất với nhu cầu, kèm bảng so sánh ngắn gọn để Anh/Chị tiện tham khảo trước khi quyết định."
  - step: urgency_soft
    script: "Hiện tại một số căn đang được nhiều khách hỏi. Em sẽ ghi nhận quan tâm của Anh/Chị để ưu tiên thông tin nếu có biến động."

fallback: "Anh/Chị cứ thoải mái suy nghĩ. Em sẵn sàng hỗ trợ bất cứ khi nào Anh/Chị cần thêm thông tin."
