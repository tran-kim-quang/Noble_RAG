objection: gia_cao
label: "Giá cao"
triggers:
  - "giá cao quá"
  - "đắt quá"
  - "vượt ngân sách"
  - "không đủ tiền"
  - "cao hơn dự kiến"

approach:
  - step: empathize
    script: "Em hiểu Anh/Chị đang cân nhắc về chi phí — đây là quyết định quan trọng. Em muốn chia sẻ thêm vài điểm để Anh/Chị có cái nhìn đầy đủ hơn."
  - step: reframe_value
    script: "Mức giá này đã tính toàn bộ tiện ích, pháp lý sạch và chính sách thanh toán linh hoạt. Khi so sánh giá trên m², Anh/Chị sẽ thấy đây là mức cạnh tranh trong khu vực."
  - step: financing_option
    script: "Ngoài ra, dự án hỗ trợ vay ngân hàng lên đến 70% giá trị với lãi suất ưu đãi năm đầu. Em có thể hỗ trợ Anh/Chị tính toán khoản trả hàng tháng không?"
  - step: soft_close
    script: "Nếu Anh/Chị muốn, em gửi bảng giá chi tiết và phương án thanh toán để Anh/Chị tham khảo trước nhé?"

fallback: "Nếu tầm ngân sách hiện tại chưa phù hợp, em có thể tư vấn thêm các phân khúc khác trong hệ thống Noble. Anh/Chị đang có ngân sách khoảng bao nhiêu để em tìm phương án phù hợp nhất ạ?"
