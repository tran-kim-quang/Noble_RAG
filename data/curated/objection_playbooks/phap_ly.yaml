objection: phap_ly
label: "Băn khoăn pháp lý"
triggers:
  - "pháp lý chưa rõ"
  - "sổ đỏ chưa có"
  - "chưa có sổ"
  - "pháp lý chưa hoàn chỉnh"
  - "lo ngại pháp lý"

approach:
  - step: empathize
    script: "Anh/Chị lo lắng về pháp lý là hoàn toàn đúng — đây là điểm quan trọng nhất khi mua bất động sản."
  - step: clarify_status
    script: "Dự án đã có [tình trạng pháp lý cụ thể từ knowledge base]. Em có thể cung cấp tài liệu pháp lý chi tiết để Anh/Chị kiểm tra."
  - step: trust_signal
    script: "Các dự án Noble đều được phát triển bởi chủ đầu tư uy tín với lịch sử bàn giao đúng tiến độ. Khách hàng đã nhận sổ tại [dự án trước] là minh chứng rõ nhất."
  - step: soft_close
    script: "Em có thể gửi hồ sơ pháp lý dự án để Anh/Chị nhờ luật sư hoặc chuyên gia kiểm tra nếu cần. Anh/Chị muốn em gửi qua Zalo hay email ạ?"

fallback: "Em sẽ xác nhận lại thông tin pháp lý mới nhất và phản hồi Anh/Chị trong thời gian sớm nhất."
