version: '3.8'

name: noble_rag

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16.2-alpine
    container_name: noble_rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-noble_rag}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-noble_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noble_rag_net
    restart: unless-stopped

  # ==================== Qdrant ====================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: noble_rag_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noble_rag_net
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: redis:7.2-alpine
    container_name: noble_rag_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      ${REDIS_PASSWORD:+--requirepass} ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noble_rag_net
    restart: unless-stopped

  # ==================== pgAdmin (Optional - for PostgreSQL UI) ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: noble_rag_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - noble_rag_net
    restart: unless-stopped

  # ==================== RAG Service (LightRAG) ====================
  rag-service:
    build:
      context: ./service/RAG
    container_name: noble_rag_service
    ports:
      - "${RAG_SERVICE_PORT:-8000}:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-large}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-3072}
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/${POSTGRES_DB:-noble_rag}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - CHUNK_SIZE=${CHUNK_SIZE:-1024}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-20}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RAG_SERVICE_HOST=0.0.0.0
      - RAG_SERVICE_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - noble_rag_net
    restart: unless-stopped

  # ==================== Whisper Service ====================
  whisper-service:
    build:
      context: ./service/whisper-service
      args:
        BASE_IMAGE: nvidia/cuda:12.3.2-cudnn9-runtime-ubuntu22.04
        WHISPER_DEVICE: cuda
        WHISPER_COMPUTE: float16
        WHISPER_MODEL: large-v3
    container_name: whisper-service
    shm_size: '2gb'
    ports:
      - "8001:8001"
    environment:
      - WHISPER_MODEL=large-v3
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE=float16
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - whisper_cache:/app/.cache/hf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - noble_rag_net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  whisper_cache:
    driver: local

networks:
  noble_rag_net:
    driver: bridge
