version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: noble_ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./volumes/ollama:/root/.ollama
    expose:
      - "11434"
    networks:
      - internal_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: noble_qdrant
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    networks:
      - internal_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: noble_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - internal_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  retrieval-service:
    build:
      context: ..
      dockerfile: retrieval_service/Dockerfile
      args:
        EMBEDDING_PROFILE: local
    container_name: noble_retrieval_service
    hostname: desktop
    env_file:
      - ./.env.retrieval
    depends_on:
      - ollama
      - qdrant
    expose:
      - "8011"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  vision-service:
    build:
      context: ..
      dockerfile: vision_service/Dockerfile
    container_name: noble_vision_service
    env_file:
      - ./.env.vision
    volumes:
      - ../face_db:/app/face_db
    expose:
      - "8031"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  orchestrator-service:
    build:
      context: ..
      dockerfile: orchestrator_service/Dockerfile
    container_name: noble_orchestrator_service
    env_file:
      - ./.env.orchestrator
    depends_on:
      - ollama
      - retrieval-service
      - vision-service
      - redis
    ports:
      - "${ORCH_BIND_IP:-127.0.0.1}:8021:8021"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8021/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  internal_net:
    driver: bridge
