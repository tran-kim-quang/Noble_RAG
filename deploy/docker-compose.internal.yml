version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: noble_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  retrieval-service:
    build:
      context: ..
      dockerfile: retrieval_service/Dockerfile
      args:
        EMBEDDING_PROFILE: remote
    container_name: noble_retrieval_service
    hostname: desktop
    env_file:
      - ./env/retrieval.env
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8011"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  orchestrator-service:
    build:
      context: ..
      dockerfile: orchestrator_service/Dockerfile
    container_name: noble_orchestrator_service
    env_file:
      - ./env/orchestrator.env
    depends_on:
      - retrieval-service
    ports:
      - "${ORCH_BIND_IP:-127.0.0.1}:8021:8021"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8021/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  qdrant_data:

networks:
  internal_net:
    driver: bridge
